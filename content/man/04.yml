# Màn chặng 4 · AI làm việc trên máy tính.
man:
  - kieu: bia
    so: "04"
    tieuDe: AI làm việc **trên máy tính** của anh chị
    phu: Chặng 4 · 25 phút · Cowork và đội trợ lý chạy song song
    loi:
      - "Sang chặng bốn. Phần này hơi nâng cao, nhưng mình nghĩ giờ ai cũng nên biết: cho AI vào làm việc ngay trên máy tính của mình."

  - kieu: bang
    tieuDe: Nhân sự **làm từ xa** hay nhân sự **đến tận nơi**?
    cotTieuDe: [ "", Chat trên trang web, Cowork · Claude Desktop ]
    dong:
      - [ Cách làm, Hỏi một câu trả lời một câu, "**Nhận nhiệm vụ**, tự lập kế hoạch và làm nhiều bước" ]
      - [ Tệp, "Tải lên bản sao, nhận lại chữ", "**Đọc và sửa tệp gốc** trên máy, trong thư mục được cho phép (qua Claude Desktop)" ]
      - [ Đội ngũ, Một luồng trò chuyện, "**Nhiều trợ lý phụ** chạy song song" ]
      - [ Lịch, Hỏi mới trả lời, "**Tự chạy theo lịch**, ví dụ 7 giờ sáng gửi bản tin" ]
    loi:
      - Từ đầu buổi đến giờ, AI vẫn là nhân sự làm từ xa. Muốn cùng nó sửa một tệp, mình phải bảo nó tạo tệp, tải về, sửa, rồi lại tải lên. Lên lên xuống xuống, mệt lắm.
      - Cowork thì khác. Nó nhận nhiệm vụ rồi tự lên kế hoạch, tự làm nhiều bước. Có ứng dụng Claude trên máy tính, nó đọc và sửa thẳng tệp trong thư mục mình cho phép.
      - Nó còn chia việc cho nhiều trợ lý phụ chạy cùng lúc, và tự chạy theo lịch, ví dụ sáng nào bảy giờ cũng gửi bản tin.

  - kieu: luong
    tieuDe: "AI **đề xuất trước**, anh chị **duyệt rồi mới chạy**"
    buoc:
      - ten: Anh chị giao việc
        moTa: “Đề xuất, chờ duyệt”
      - ten: AI xem danh sách
        moTa: Tên · loại · dung lượng · ngày
      - ten: AI đề xuất cách xếp
        moTa: Kèm thư mục “cần xóa”
    nhanh:
      hoi: Anh chị duyệt?
      co: AI làm thật, trên tệp của anh chị.
      chua: Góp ý cụ thể, làm theo được → AI đề xuất lại.
    loi:
      - Ví dụ mình hay đưa là dọn thư mục Tải về. Trên máy chẳng có thư mục nào bừa bộn hơn thư mục này.
      - "Nguyên tắc vàng là giao kèm một câu: đề xuất trước, chờ tôi duyệt. AI xem danh sách tệp, rồi đề xuất cách xếp, kèm một chỗ gom những tệp nên bỏ."
      - Mình đồng ý thì nó mới làm thật. Chưa ưng thì góp ý cụ thể, đúng thói quen thứ nhất ở chặng hai, để nó đề xuất lại.

  - kieu: minhHoa
    tieuDe: "Minh họa: **dọn thư mục Tải về** bằng Cowork"
    video: /minh-hoa/cowork.mp4
    chot: Chọn Cowork ở ô nhập → cho phép đúng một thư mục → giao việc kèm “chờ tôi duyệt” → duyệt → trợ lý phụ làm song song → báo cáo.
    loi:
      - Mình xem minh họa. Ở ô nhập, chọn Cowork, rồi thêm đúng thư mục cần dọn, ở đây là Downloads.
      - Giao việc kèm câu đề xuất trước, chờ tôi duyệt. AI đọc thông tin tệp rồi đưa ra đề xuất. Lúc này nó chưa đụng vào tệp nào.
      - Để xếp tệp, AI thường chỉ đọc thông tin chung như tên, loại, dung lượng, ngày tạo. Ghép thêm lịch sự kiện thì nó còn biết ảnh nào chụp ở sự kiện nào.
      - Mình bấm đồng ý thì AI mới làm thật, và chia việc cho mấy trợ lý phụ làm song song.
      - Cuối cùng nó báo lại đã làm gì, còn gì chờ mình quyết. Tệp nên bỏ được gom vào một chỗ, còn xóa hay không vẫn là việc của mình.

  - kieu: ds
    tieuDe: An toàn khi để AI **chạm vào máy**
    dau: tich
    ds:
      - ten: Chỉ cho phép đúng thư mục cần làm
        moTa: Đừng giao kiểu “dọn cả ổ C”.
      - ten: Thử trước ở thư mục thử nghiệm, dữ liệu giả lập
      - ten: Không mở ngân hàng, email cá nhân, dữ liệu khách thật
        moTa: AI có thể gặp lỗi, hoặc bị nội dung độc hại dẫn sai thao tác.
      - ten: Luôn đề xuất trước, duyệt rồi mới làm
    loi:
      - Nhiều người hỏi cho nó vào máy thì có rủi ro không. Với Cowork, mình cho thư mục nào thì nó chỉ làm trong thư mục đó.
      - Đừng bao giờ bảo nó dọn cả ổ C. Lỡ tay xóa nhầm một tệp hệ thống là phải cài lại Windows đấy.
      - Cứ thử trước ở thư mục thử nghiệm với dữ liệu giả. Mật khẩu, ngân hàng, email cá nhân thì để ở chỗ AI không vào được. Và luôn để nó đề xuất trước, mình duyệt rồi mới làm.

  - kieu: songSong
    tieuDe: Một cuộc trò chuyện chính **điều phối cả đội**
    dieuPhoi: Cuộc trò chuyện chính
    songSong:
      - ten: Lấy số bán hàng
        moTa: trợ lý 1 · Excel
      - ten: Lấy lịch họp tuần
        moTa: trợ lý 2 · Calendar
      - ten: Lấy việc còn tồn
        moTa: trợ lý 3 · Notion
    tuanTu:
      - ten: Tổng hợp số liệu
        moTa: trợ lý 4
      - ten: Viết nhận xét
        moTa: trợ lý 5
      - ten: Kiểm tra chéo
        moTa: trợ lý 6
    chot: Việc độc lập → chạy song song. Việc cần kết quả bước trước → chạy tuần tự.
    loi:
      - Còn một mảnh nữa là trợ lý phụ, hay sub-agent. Đây là các trợ lý mà cuộc trò chuyện chính gọi ra khi cần. Làm được đến đây là anh chị đã đặt một chân lên cấp bốn.
      - Ví dụ làm báo cáo tuần. Một trợ lý lấy số bán hàng trong Excel, một trợ lý lấy lịch họp, một trợ lý lấy việc còn tồn trong Notion. Ba việc này độc lập nên chạy cùng lúc.
      - "Xong rồi mới chạy lần lượt: một trợ lý tổng hợp số liệu, một trợ lý viết nhận xét, một trợ lý kiểm tra chéo xem số lấy đã đúng chưa."
      - Cái hay là mỗi trợ lý phụ có đầu óc sạch. Nó chỉ nhận đúng phần việc, không đọc những gì mình bàn trước đó, làm xong thì trả kết quả. Như trưởng nhóm giao việc rồi nghiệm thu.
      - "Mặc định AI hơi lười, ít khi tự gọi trợ lý phụ. Mình chỉ cần dặn một câu: chia việc cho trợ lý phụ nhé. Nó sẽ tự chia."

  - kieu: hop
    tieuDe: Những giới hạn cần biết
    noi: Cowork **chỉ có ở gói trả phí**. Làm việc với tệp trên máy cần ứng dụng Claude Desktop. Hôm nay anh chị **xem minh họa và video làm mẫu**, chưa cần cài.
    phu: Giờ xem video mẫu, rồi làm 4 bước của chặng 4.
    loi:
      - Lưu ý là Cowork chỉ có ở gói trả phí. Muốn nó làm việc với tệp trên máy thì cần cài ứng dụng Claude trên máy tính.
      - "Hôm nay anh chị chưa cần cài. Mình xem minh họa và video làm mẫu, để ý trình tự: đề xuất, duyệt, làm, báo cáo. Rồi anh chị làm bốn bước của chặng bốn."
