# Màn chặng 4 · AI làm việc trên máy tính.
man:
  - kieu: bia
    so: "04"
    tieuDe: AI làm việc **trên máy tính** của anh chị
    phu: Chặng 4 · 25 phút · Cowork và đội trợ lý chạy song song
    loi:
      - Nốt một phần cuối cùng. Đây là kiến thức hơi nâng cao, nhưng mình nói sơ qua để mọi người biết.

  - kieu: bang
    tieuDe: Nhân sự **làm từ xa** hay nhân sự **đến tận nơi**?
    cotTieuDe: [ "", Chat trên trang web, Cowork · Claude Desktop ]
    dong:
      - [ Cách làm, Hỏi một câu trả lời một câu, "**Nhận nhiệm vụ**, tự lập kế hoạch và làm nhiều bước" ]
      - [ Tệp, "Tải lên bản sao, nhận lại chữ", "**Đọc và sửa tệp gốc** trên máy, trong thư mục được cho phép (qua Claude Desktop)" ]
      - [ Đội ngũ, Một luồng trò chuyện, "**Nhiều trợ lý phụ** chạy song song" ]
      - [ Lịch, Hỏi mới trả lời, "**Tự chạy theo lịch**, ví dụ 7 giờ sáng gửi bản tin" ]
    loi:
      - Từ nãy giờ, AI vẫn chỉ là một bạn nhân sự làm từ xa, nằm trên trang Claude hay ChatGPT.
      - Muốn cùng bạn ấy sửa một tệp, mình phải bảo tạo tệp, tải về, sửa, rồi tải ngược lên. Lên lên xuống xuống, mệt lắm.
      - Nhưng có một lựa chọn nữa là chuyển sang Cowork. Có ứng dụng Claude trên máy tính, nó dùng được các tệp trên máy mình, sửa trực tiếp luôn trên đó.
      - Nó còn chia được việc cho nhiều trợ lý phụ chạy cùng lúc, và chạy theo lịch, ví dụ bảy giờ sáng nào cũng gửi bản tin.

  - kieu: luong
    tieuDe: "AI **đề xuất trước**, anh chị **duyệt rồi mới chạy**"
    buoc:
      - ten: Anh chị giao việc
        moTa: “Đề xuất, chờ duyệt”
      - ten: AI xem danh sách
        moTa: Tên · loại · dung lượng · ngày
      - ten: AI đề xuất cách xếp
        moTa: Kèm thư mục “cần xóa”
    nhanh:
      hoi: Anh chị duyệt?
      co: AI làm thật, trên tệp của anh chị.
      chua: Góp ý cụ thể, làm theo được → AI đề xuất lại.
    loi:
      - Ví dụ mình hay đưa là bảo nó dọn thư mục Tải về. Thư mục rác nhất trên máy luôn, chẳng có thư mục nào rác hơn.
      - "Mình bảo nó phân tích thư mục này và đề xuất cách dọn. Nó tự vào xem có những tệp gì, rồi trả về: tệp này nên gom vào một thư mục, tệp này bị trùng, mấy bộ cài này có thể xóa."
      - Nguyên tắc là để nó đề xuất trước, mình duyệt rồi nó mới làm. Chưa ưng thì góp ý cụ thể, làm theo được, để nó đề xuất lại.

  - kieu: minhHoa
    tieuDe: "Minh họa: **dọn thư mục Tải về** bằng Cowork"
    video: /minh-hoa/cowork.mp4
    chot: Chọn Cowork ở ô nhập → cho phép đúng một thư mục → giao việc kèm “chờ tôi duyệt” → duyệt → trợ lý phụ làm song song → báo cáo.
    loi:
      - Mình xem minh họa. Chuyển sang Cowork, thêm thư mục, chọn Downloads. Rồi bảo nó phân tích và đề xuất cách dọn.
      - "Mặc định nó không đọc nội dung bên trong từng tệp, vì như thế tốn rất nhiều. Nó đọc thông tin chung của tệp: tên, kích thước, ngày tạo, ảnh thì có cả tên thiết bị chụp."
      - Đưa thêm lịch sự kiện thì nó biết luôn ảnh nào của sự kiện nào, dựa vào ngày tháng, rồi sắp xếp giúp mình. Giống Cô Tấm nhặt thóc ra thóc, gạo ra gạo vậy.
      - Mình đồng ý thì nó mới làm thật, chia việc cho mấy trợ lý phụ, mỗi trợ lý phụ trách một loại tệp.
      - Cuối cùng nó báo lại đã làm gì, còn gì chờ mình quyết. Xóa hay không vẫn là mình quyết.

  - kieu: ds
    tieuDe: An toàn khi để AI **chạm vào máy**
    dau: tich
    ds:
      - ten: Chỉ cho phép đúng thư mục cần làm
        moTa: Đừng giao kiểu “dọn cả ổ C”.
      - ten: Thử trước ở thư mục thử nghiệm, dữ liệu giả lập
      - ten: Không mở ngân hàng, email cá nhân, dữ liệu khách thật
        moTa: AI có thể gặp lỗi, hoặc bị nội dung độc hại dẫn sai thao tác.
      - ten: Luôn đề xuất trước, duyệt rồi mới làm
    loi:
      - "Nhiều người sẽ hỏi: thế có rủi ro bảo mật không, nó chọc vào máy mình mà? Với Cowork, mình cho thư mục nào thì nó chỉ dùng được thư mục đó thôi."
      - Có điều, mọi người đừng bảo nó dọn cả ổ C nhé. Dọn thư mục Tải về thì được, chứ dọn ổ C mà lỡ tay xóa nhầm tệp hệ thống là cài lại Windows luôn, vui lắm.
      - Mật khẩu hay tài liệu nhạy cảm thì cất ở chỗ không cho AI vào. Đụng đến quyền nguy hiểm thì bảo nó đề xuất trước, mình là người duyệt. Luôn kiểm soát xem AI đang làm gì.

  - kieu: songSong
    tieuDe: Một cuộc trò chuyện chính **điều phối cả đội**
    dieuPhoi: Cuộc trò chuyện chính
    songSong:
      - ten: Lấy số bán hàng
        moTa: trợ lý 1 · Excel
      - ten: Lấy lịch họp tuần
        moTa: trợ lý 2 · Calendar
      - ten: Lấy việc còn tồn
        moTa: trợ lý 3 · Notion
    tuanTu:
      - ten: Tổng hợp số liệu
        moTa: trợ lý 4
      - ten: Viết nhận xét
        moTa: trợ lý 5
      - ten: Kiểm tra chéo
        moTa: trợ lý 6
    chot: Việc độc lập → chạy song song. Việc cần kết quả bước trước → chạy tuần tự.
    loi:
      - "Nhưng chưa dừng ở đó. Có không gian làm việc rồi, giờ mình muốn gọi hội ra làm cùng: không chỉ một mà nhiều nhân sự AI."
      - Đây là lúc đặt một chân lên cấp bốn, với sub-agent, tức là trợ lý phụ.
      - "Trợ lý phụ là những bạn hỗ trợ cho trợ lý chính. Cần gì thì trợ lý chính gọi các bạn ấy ra làm, theo đúng cách chia việc: việc gì làm song song, việc gì làm tuần tự."
      - "Ví dụ báo cáo tuần: một bạn lấy số bán hàng trong Excel, một bạn lấy lịch họp trên Google Calendar, một bạn lấy việc còn tồn trên Notion."
      - Rồi một bạn tổng hợp, một bạn nhận xét, một bạn kiểm tra chéo.
      - Tại sao nên dùng trợ lý phụ? Vì mỗi bạn có đầu óc trắng tinh. Nó không đọc lịch sử trò chuyện của mình với trợ lý chính, nên không bị thiên kiến, nhìn việc như người thứ ba.
      - Giống như mình là trưởng nhóm. Mình ngồi lên kế hoạch rồi giao xuống ba bạn.
      - Ba bạn không cần biết mình đã bàn gì, mình cũng không cần biết các bạn làm chi tiết ra sao, chỉ nghiệm thu đầu ra thôi.
      - "Mặc định AI cũng lười, ít khi tự gọi trợ lý phụ. Mình chỉ cần dặn: chia việc cho trợ lý phụ nhé. Mình hay dùng cho ba việc: làm song song, soát lại kế hoạch, và nghiệm thu kết quả."

  - kieu: hop
    tieuDe: Những giới hạn cần biết
    noi: Cowork **chỉ có ở gói trả phí**. Làm việc với tệp trên máy cần ứng dụng Claude Desktop. Hôm nay anh chị **xem minh họa và video làm mẫu**, chưa cần cài.
    phu: Giờ xem video mẫu, rồi làm 4 bước của chặng 4.
    loi:
      - Lưu ý là Cowork chỉ có ở gói trả phí. Muốn nó làm việc với tệp trên máy thì cần cài ứng dụng Claude trên máy tính.
      - "Hôm nay anh chị chưa cần cài. Mình xem minh họa và video làm mẫu, để ý trình tự: đề xuất, duyệt, làm, báo cáo. Rồi anh chị làm bốn bước của chặng bốn."
