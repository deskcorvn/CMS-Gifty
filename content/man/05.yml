# Màn phần thực hành thêm · Thương hiệu cá nhân bằng Claude + ChatGPT.
man:
  - kieu: bia
    so: "+"
    tieuDe: Thương hiệu cá nhân bằng **Claude + ChatGPT**
    phu: Thực hành thêm · 20 phút · Claude lo phần chữ, ChatGPT lo phần ảnh · làm ra SP03, SP04
    loi:
      - Giờ sang phần thực hành thêm. Mình làm lời giới thiệu bản thân và ảnh đại diện. Phần chữ để Claude lo, phần ảnh để ChatGPT lo.

  - kieu: ds
    tieuDe: Bốn ý **thật** về mình
    ds:
      - ten: Nghề
      - ten: Khách hàng
      - ten: Thế mạnh có thể kiểm chứng
      - ten: Lời mời liên hệ
    loi:
      - "Trước hết, anh chị viết ra bốn ý thật về mình: làm nghề gì, khách là ai, mình giỏi ở điểm nào mà người khác kiểm chứng được, và mời người ta liên hệ thế nào."

  - kieu: ds
    tieuDe: Claude viết **ba thứ**
    ds:
      - ten: Một câu giới thiệu dễ nhớ
      - ten: Đoạn giới thiệu 70–100 chữ
        moTa: Cho trang cá nhân, danh thiếp điện tử
      - ten: Lời giới thiệu khoảng 30 giây
        moTa: Để nói khi gặp đối tác
    chot: Câu lệnh đã dặn không tự bịa số năm kinh nghiệm, thành tích hay đối tác. Anh chị vẫn đọc lại và xóa chỗ chưa đúng.
    loi:
      - "Rồi gửi cho Claude theo mẫu trên trang học. Claude sẽ viết ba thứ: một câu giới thiệu dễ nhớ, một đoạn bảy mươi đến một trăm chữ, và lời giới thiệu nói trong khoảng ba mươi giây."
      - Câu lệnh đã dặn không được tự bịa số năm kinh nghiệm hay thành tích. Nhưng anh chị vẫn đọc lại, chỗ nào chưa đúng sự thật thì xóa đi.

  - kieu: the
    tieuDe: ChatGPT làm được gì **với ảnh**
    cot: 4
    the:
      - ten: Tạo ảnh từ mô tả
        moTa: Tả cảnh, phong cách, màu sắc bằng lời.
      - ten: Chỉnh ảnh tải lên
        moTa: Đổi nền, ánh sáng, trang phục; giữ đúng gương mặt khi yêu cầu rõ.
      - ten: Sửa tiếp từng chỗ
        moTa: Chưa ưng chỗ nào thì nói đúng chỗ đó.
      - ten: Hạn mức miễn phí
        moTa: Có thể hết giữa lớp. Giữ câu lệnh và ảnh gốc để làm tiếp ở nhà.
    noiBat: 2
    loi:
      - ChatGPT làm được bốn việc với ảnh. Một là tạo ảnh mới, chỉ cần tả bằng lời.
      - "Hai là chỉnh ảnh mình tải lên: đổi nền, ánh sáng, trang phục. Muốn giữ đúng gương mặt thì phải dặn rõ trong câu lệnh."
      - Ba là chưa ưng chỗ nào thì nói đúng chỗ đó để nó sửa tiếp, không cần làm lại từ đầu.
      - Bốn là bản miễn phí có giới hạn số ảnh, có thể hết ngay giữa lớp. Hết thì anh chị giữ lại câu lệnh và ảnh gốc, về nhà làm tiếp.

  - kieu: ds
    tieuDe: Soát ảnh **trước khi dùng**
    dau: tich
    ds:
      - ten: Gương mặt còn giống người thật?
      - ten: Thu nhỏ thành ảnh đại diện vẫn dễ nhìn?
      - ten: Trang phục hợp nghề và khách hàng?
      - ten: Khác thực tế thì chỉnh tiếp, hoặc quay về ảnh gốc
    chot: Chỉ dùng ảnh chân dung của chính mình. Không dùng hình ảnh gây hiểu nhầm về con người thật.
    loi:
      - "Chỉ dùng ảnh chân dung của chính mình thôi nhé ạ. Trước khi dùng thì soát lại: mặt còn giống mình không, thu nhỏ có dễ nhìn không, trang phục có hợp nghề không."
      - Chỗ nào khác thực tế thì chỉnh lại, hoặc quay về ảnh gốc. Giờ anh chị làm năm bước, rồi lưu SP03 và SP04.
