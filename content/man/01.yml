# Màn chặng 1 · Hiểu AI. Xác suất trong màn "xacSuat" là số minh họa cho dễ hình dung, không phải số đo.
man:
  - kieu: bia
    so: "01"
    tieuDe: Hiểu AI — nó **“nghĩ”** thế nào, vì sao hay bịa
    phu: Chặng 1 · 30 phút
    loi:
      - Vào chặng một. Trước khi giao việc cho AI, mình cần hiểu bên trong nó đang thực sự làm gì.

  - kieu: xacSuat
    tieuDe: AI không “hiểu”. Nó **đoán chữ tiếp theo**.
    cot:
      - nhan: Câu quen thuộc
        cau: Một con vịt xòe ra hai cái
        luaChon: [ [ cánh, 97 ], [ chân, 2 ], [ mắt, 1 ] ]
      - nhan: Câu mơ hồ
        cau: Lúc rảnh, tôi thường
        luaChon: [ [ đi chơi, 20 ], [ đọc sách, 17 ], [ xem phim, 15 ], [ ngủ, 12 ] ]
    chot: Chỗ nào nhiều lựa chọn ngang nhau, chỗ đó AI dễ bịa. Việc càng mơ hồ, càng nhiều chỗ để bịa. (Số trên màn chỉ để minh họa.)
    loi:
      - "Điều đầu tiên anh chị nên nhớ: AI không hiểu ý nghĩa hay tâm tư của mình đâu. Nói cho dễ hiểu, nó chỉ đang đoán chữ tiếp theo, dựa trên xác suất."
      - Xác suất là sao? Là cái gì nó được đọc nhiều, gặp nhiều trong tài liệu, thì khi mình hỏi câu tương tự, nó sẽ đưa đúng cái đó ra.
      - Ví dụ câu “Một con vịt xòe ra hai cái…”. Gần như ai gõ vào cũng ra chữ “cánh”. Câu này quen quá rồi, mà con vịt cũng chẳng xòe được gì khác.
      - Còn câu “Lúc rảnh, tôi thường…” thì sao? Đi chơi, đọc sách, xem phim, đi ngủ. Mỗi người một sở thích, chẳng có đáp án chuẩn nào cả.
      - AI không biết gì về mình thì vẫn phải chọn một đáp án, và nói rất tự tin. Thế là thành bịa. Bản chất là nó thiếu thông tin, chứ nó không cố tình nói sai.
      - Mà người cũng vậy thôi. Sếp giao một câu cụt lủn, mình cũng phải tự đoán “chắc ý sếp là thế này”. Nên đừng chê AI dốt. Cứ đưa thêm thông tin, rồi tự kiểm tra lại.

  - kieu: chat
    tieuDe: Thử ngay trên máy của anh chị
    hoi: "Điền đúng MỘT từ vào chỗ trống: 1. Một con vịt xòe ra hai cái ___  2. Lúc rảnh, tôi thường ___"
    dap: "1. cánh  2. … (mỗi máy một kiểu)"
    chot: So kết quả với người ngồi cạnh. Câu 1 giống nhau, câu 2 khác nhau.
    loi:
      - "Giờ anh chị thử luôn nhé. Làm bước ba trên trang học: dán câu lệnh vào Claude, rồi quay sang so kết quả với người ngồi cạnh."
      - Câu con vịt thì cả lớp gần như giống nhau. Câu lúc rảnh thì mỗi máy một kiểu. Chỗ khác nhau đó chính là chỗ AI đang đoán.

  - kieu: bang
    tieuDe: Mỗi AI học từ **một kho khác nhau**
    cotTieuDe: [ AI, Gắn với, Hợp cho việc ]
    dong:
      - [ Gemini, Google Tìm kiếm, Tra cứu kiến thức phổ biến ]
      - [ ChatGPT, "Dùng đa năng, cân bằng", Việc chung; **tạo và chỉnh ảnh** ]
      - [ Grok, Mạng xã hội X, "Tin trên mạng xã hội, giọng văn đời thường" ]
      - [ Claude, "Lập luận, cấu trúc", "Sắp xếp thông tin, viết dài, dựng quy trình" ]
    noiBat: 4
    chot: Cảm nhận khi dùng thực tế, không phải xếp hạng chính thức. Hôm nay dùng Claude làm ví dụ; cách giao việc dùng được cho mọi AI.
    loi:
      - Điều thứ hai. Mỗi AI được học từ một kho dữ liệu khác nhau, nên mỗi con mạnh một kiểu.
      - Gemini là của Google, mà Google mạnh nhất là tìm kiếm. Cần tra kiến thức phổ biến, so giá hay so tính năng sản phẩm, thì dùng Gemini rất nhanh.
      - "ChatGPT thì cân bằng, việc gì cũng làm được: viết bài, làm ảnh, làm slide. Lát nữa mình dùng nó để làm ảnh đại diện."
      - Grok được học nhiều từ mạng xã hội X, nên giọng văn tự nhiên, đời thường, và bắt tin tức trên mạng xã hội nhanh.
      - Còn Claude mạnh về lập luận, cấu trúc, sắp xếp thông tin. Đây là con mình dùng nhiều nhất, và cũng là con mình dùng xuyên suốt hôm nay.
      - Đây là cảm nhận khi dùng thôi, không phải bảng xếp hạng. Cách nghĩ và cách giao việc hôm nay thì dùng cho con nào cũng được.

  - kieu: bac
    tieuDe: Anh chị đang dùng AI ở **cấp nào**?
    bac:
      - ten: Hỏi đáp
        moTa: Dùng thay Google, viết, dịch lặt vặt.
      - ten: Có một nhân sự AI
        moTa: Biết công việc, công cụ và quy trình của anh chị.
      - ten: Trưởng phòng
        moTa: Nhiều nhân sự AI, anh chị là người điều phối.
      - ten: Kinh doanh một người
        moTa: Các AI tự phối hợp theo quy trình.
      - ten: Cả tổ chức
        moTa: Nhiều người dùng chung, mỗi người đúng quyền.
    noiBat: 3
    nhanNoiBat: Đích hướng tới
    chot: Cấp 3 là biết lái xe. Cấp 4, 5 là biết chế tạo xe. Phần lớn chúng ta chỉ cần lái giỏi.
    loi:
      - Giờ mình nói về các cấp độ dùng AI, để anh chị biết mình đang đứng ở đâu. Có năm cấp.
      - "Cấp một là hỏi đáp. Ngày xưa mở Google ra tìm, giờ mở AI ra hỏi. Phần lớn mọi người đang ở đây: hỏi xong, AI hướng dẫn, nhưng mình vẫn phải tự đi làm."
      - Cấp hai là có một nhân sự AI. Mình đưa cho nó bối cảnh, thông tin về mình, công cụ và quy trình, để nó làm cùng mình. Nhanh thì ngay buổi này anh chị lên được cấp hai.
      - "Cấp ba mình gọi là trưởng phòng. Mình có nhiều nhân sự AI, mỗi bạn lo một mảng: bạn viết bài, bạn lên kế hoạch, bạn đi xem đối thủ. Mình là người chia việc."
      - "Cấp bốn giống làm giám đốc: mình chỉ giao cho bạn trưởng phòng AI, bạn ấy tự chia việc tiếp. Cấp năm là cả công ty dùng chung, mỗi người chỉ xem được phần của mình."
      - Hình dung như đi xe. Cấp ba là biết lái xe, còn cấp bốn, cấp năm là chế tạo xe. Mình là người dùng thì lái giỏi là đủ. Hôm nay mình nhắm tới cấp ba.

  - kieu: hop
    tieuDe: AI là một **thực tập sinh tài năng** mới vào công ty
    noi: Rất giỏi, nhưng chưa biết gì về anh chị và việc của anh chị. → **Cách anh chị giao việc quyết định chất lượng việc AI làm ra.**
    phu: Giờ anh chị làm 7 bước của chặng 1 trên trang học.
    loi:
      - "Có một tư duy mình muốn anh chị nhớ mãi: hãy coi AI là một bạn thực tập sinh rất tài năng vừa vào công ty."
      - Bạn ấy biết rất nhiều, nhưng chưa biết gì về công ty mình, khách của mình, sản phẩm của mình. Những thông tin đó không có sẵn trong đầu bạn ấy.
      - Nên anh chị phải đổi vai, làm sếp của bạn ấy. Mà sếp giao việc thế nào thì nhận lại thế ấy. Đó là chuyện của chặng hai.
      - Giờ anh chị làm bảy bước của chặng một trên trang học nhé.
