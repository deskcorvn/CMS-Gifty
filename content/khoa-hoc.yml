  ten: Nguyễn Mạnh Hùng
  chucDanh: Giám đốc Gifty Tech
  kinhNghiem: 10.000 giờ sử dụng AI
  anh: /images/nguyen-manh-hung.png
  nguon: https://www.giftytech.com/khoa-hoc-ai-thuc-chien
