# Màn chốt lại.
man:
  - kieu: bac
    tieuDe: Đủ **5 mảnh ghép** = cấp 3 · Trưởng phòng
    bac:
      - nhan: "01"
        ten: Tư duy
        moTa: Giao việc, Instruction, Memory · chặng 1–3
      - nhan: "02"
        ten: Công cụ
        moTa: Connector nối ứng dụng · chặng 3
      - nhan: "03"
        ten: Công thức
        moTa: Skill · chặng 3
      - nhan: "04"
        ten: Môi trường
        moTa: Cowork trên máy của anh chị · chặng 4
      - nhan: "05"
        ten: Đội ngũ
        moTa: Trợ lý phụ chạy song song · chặng 4
    chot: Xây dần từ dưới lên. Mỗi Project là một nhân sự; bên trong có thể có trợ lý phụ.
    loi:
      - Mình chốt lại cả buổi. Để có một nhân sự AI ở cấp ba, mình xây dần năm mảnh ghép, từ dưới lên.
      - "Đầu tiên là tư duy: giao việc cho đúng, instruction, memory. Tiếp theo là công cụ, tức là kết nối ứng dụng. Rồi đến công thức, tức là skill."
      - Sau đó là môi trường làm việc, Cowork vào làm ngay trên máy. Cuối cùng là đội ngũ, các trợ lý phụ chạy song song.
      - Đủ năm mảnh này, anh chị không còn là người dùng AI bình thường nữa, mà là trưởng phòng điều phối nhiều nhân sự AI. Mỗi Project là một nhân sự, bên trong lại có trợ lý phụ.

  - kieu: ds
    tieuDe: Bắt đầu **từ tuần này**
    ds:
      - ten: Tạo một Project “Trợ lý cá nhân”
        moTa: Nói tự do về việc của mình, để AI viết Instruction.
      - ten: Nối Google Calendar và Notion
        moTa: "Giao một việc thật: lên lịch, tạo việc cần làm."
      - ten: Chọn một việc lặp lại mỗi tuần
        moTa: Làm cùng AI tới khi ưng, rồi gói thành skill.
    loi:
      - "Về nhà nên làm gì? Làm luôn ba việc. Một: tạo một Project trợ lý cá nhân, nói tự do về việc của mình để AI viết instruction."
      - "Hai: nối Google Calendar, Gmail hay Notion, rồi giao cho nó một việc thật, như lên lịch hay tạo việc cần làm."
      - "Ba: cuối tuần ngồi xem lại tuần qua còn làm tay việc gì lặp đi lặp lại. Ghi vào danh sách, làm cùng AI tới khi ưng, rồi gói thành skill. Mỗi tuần mình nhẹ đi một chút."

  - kieu: hop
    tieuDe: Điều nhớ nhất
    noi: Cái gì **máy làm tốt** thì người đừng làm. Định hướng, hiểu khách hàng và quyết định cuối cùng **vẫn là việc của mình**.
    phu: Không cần giỏi công nghệ mới bắt đầu. Vướng chỗ nào, hỏi chính AI cách dùng nó.
    loi:
      - "Có một câu mình muốn anh chị mang về: cái gì máy làm tốt thì người đừng làm. Việc lặp lại, đã có quy trình, máy làm tốt hơn mình nhiều."
      - Còn việc của mình là định hướng, biết mình muốn gì, và hiểu khách hàng thực sự cần gì. Những thứ đó AI không làm thay được.
      - Dùng AI là dễ nhất rồi, chỉ cần mở miệng ra nói. Vướng chỗ nào, cứ chụp màn hình gửi cho nó và hỏi tiếp làm sao. Không cần đi tìm chuyên gia nào cả.
      - Giờ anh chị bấm hoàn thành đủ các chặng để nhận chứng chỉ. Cảm ơn cả nhà đã học cùng Gifty Tech.
