# Thông tin chung của khóa. Sửa được trong Pages CMS (mục "Thông tin khóa").
# Mọi dữ kiện ở đây lấy từ "Giáo trình Buổi 1 — Hiểu AI và làm việc cùng AI", phiên bản 2.0, 10/10/2026.
ten: Khóa đào tạo AI
tieuDePhu: Hiểu AI và làm việc cùng AI
moTa: >-
  Ứng dụng thực tế trong kinh doanh, chăm sóc mối quan hệ và xây dựng thương hiệu cá nhân.
  Học bằng Claude Free và ChatGPT Free, không cần biết lập trình, không cần mua gói trả phí.
camKet: >-
  Học viên hiểu cách AI hoạt động, tự thiết lập Claude, biến danh sách mối quan hệ thành kế hoạch
  chăm sóc, khởi tạo trợ lý công việc có thể dùng lại và chuẩn bị hồ sơ thương hiệu cá nhân.
hocPhi: 2000 # TẠM ĐỂ THỬ CHUYỂN KHOẢN — đổi lại 300000 sau khi test
thoiLuongPhut: 180
phienBanGiaoTrinh: "2.0 · cập nhật 10/10/2026"
lop:
  ngay: "2026-10-21"
  gio: "14:00"
  thu: Thứ Tư
  # Để trống thì trang hiện "Gifty Tech gửi địa điểm qua email".
  diaDiem: ""
doiTuong: >-
  Doanh nhân, chủ cửa hàng, chuyên viên bán hàng, người làm dịch vụ, quản lý nhóm, thành viên các
  cộng đồng kinh doanh.
khongThuoc: >-
  Buổi học không gồm: triển khai website thật, đăng bài tự động, cấp quyền Facebook/TikTok/YouTube,
  cấu hình MCP, lập trình Claude Code, vận hành CRM cho doanh nghiệp, xử lý dữ liệu khách hàng thật.
sanPham:
  - ma: SP01
    ten: Bảng khách hàng mẫu + kế hoạch 7 ngày
    dieuKien: Đủ 12 dòng dữ liệu; có tối thiểu 5 ưu tiên, lý do và đầu việc; không bịa thông tin.
    chang: 5
  - ma: SP02
    ten: "Trợ lý Claude: “Trợ lý kinh doanh của tôi”"
    dieuKien: Có Project/hướng dẫn riêng; thử lại ít nhất một yêu cầu với dữ liệu mẫu.
    chang: 6
  - ma: SP03
    ten: Hồ sơ thương hiệu cá nhân
    dieuKien: Có một câu định vị, đoạn giới thiệu 70–100 chữ, lời giới thiệu khoảng 30 giây.
    chang: 7
  - ma: SP04
    ten: Ảnh đại diện thương hiệu hoặc bộ lệnh chỉnh ảnh sẵn dùng
    dieuKien: >-
      Ảnh giữ nhận dạng, tự nhiên; nếu hết hạn mức Free thì lưu sẵn câu lệnh và ảnh gốc để hoàn thiện
      sau lớp.
    chang: 7
chuanBi:
  - Laptop và sạc; đăng nhập sẵn Claude Free (claude.ai) và ChatGPT Free (chatgpt.com) trước giờ học.
  - Một ảnh chân dung của chính mình được phép chỉnh; tránh ảnh người khác nếu chưa có sự đồng ý.
  - "Một mô tả ngắn: mình làm nghề gì, ai là khách hàng, dịch vụ chính, điểm mạnh, cách liên hệ."
  - Không cần mang danh sách khách hàng thật; lớp cung cấp dữ liệu giả lập.
  - Không dùng hết hạn mức tạo ảnh hoặc trò chuyện sát giờ học nếu muốn thực hành đồng thời.
chungChi:
  danhHieu: Hoàn thành xuất sắc
  nguoiKy: Nguyễn Mạnh Hùng
  chucDanh: Giám đốc
  donVi: Gifty Tech
  # Ảnh chữ ký nằm ở public/chu-ky-hung.svg (tạo bằng scripts/ve-chu-ky.mjs).
video:
  tieuDe: "Tôi giao mục tiêu. AI tự mở phần mềm, thực hiện và báo cáo kết quả."
  # Link video quay sẵn (YouTube không công khai hoặc file MP4). Trống thì trang báo "có sau buổi học".
  url: ""
cauChot: >-
  Không cần giỏi công nghệ mới bắt đầu dùng AI. Chỉ cần hiểu mình đang làm gì, biết cung cấp đúng
  thông tin và giữ quyền kiểm tra, anh chị đã có thể giao được việc thực tế cho AI.
