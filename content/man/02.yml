# Màn chặng 2 · Giao việc.
man:
  - kieu: bia
    so: "02"
    tieuDe: Giao việc — **5 yếu tố** để AI làm đúng ý
    phu: Chặng 2 · 45 phút · làm ra SP01
    loi:
      - Sang chặng hai. Đã coi AI là thực tập sinh rồi, thì giờ mình học cách làm sếp, giao việc sao cho bạn ấy làm đúng.

  - kieu: the
    tieuDe: Muốn ai làm việc cho mình, cần đủ **2 yếu tố**
    cot: 2
    danhSo: false
    the:
      - ten: Muốn làm (Will)
        moTa: Có động lực làm việc. AI thì lúc nào cũng sẵn sàng, sửa đến lần thứ mười cũng không phàn nàn.
        nhan: AI đã có sẵn
      - ten: Làm được (Able)
        moTa: Bối cảnh, công cụ, cách làm.
        nhan: Việc của anh chị
    noiBat: 2
    chot: AI luôn sẵn sàng làm. Việc của anh chị là giúp nó **làm được**.
    loi:
      - "Có một bài học mình rất thích: muốn ai làm việc cho mình thì chỉ cần hai thứ. Một là họ muốn làm. Hai là họ làm được."
      - Ví dụ nhờ đứa cháu chạy ra chợ mua đồ. Việc thì dễ, ai cũng làm được, nhưng nó chẳng muốn đi. Bảo đi đi, chú cho tiền, thế là nó đi ngay. Đó là chuyện muốn làm.
      - Cái hay của AI là lúc nào nó cũng muốn làm. Nhờ người thiết kế sửa đến lần thứ ba là mặt bắt đầu khó chịu. AI thì sửa mười lần, nửa đêm gọi dậy, nó vẫn làm.
      - "Nên với AI, mình bỏ qua được phần muốn làm. Việc của mình chỉ là giúp nó làm được: đưa đủ bối cảnh, công cụ và cách làm."

  - kieu: the
    tieuDe: Giao việc đủ **5 yếu tố**
    cot: 5
    the:
      - ten: Vai trò
        moTa: AI vào vai ai, làm cho ai đọc.
      - ten: Mục đích
        moTa: Việc này để đạt điều gì.
      - ten: Nhiệm vụ
        moTa: Chính xác làm gì, tới đâu.
      - ten: Cách làm
        moTa: Các bước, mẫu, ràng buộc.
      - ten: Yêu cầu đầu ra
        moTa: Thế nào thì gọi là xong.
    chot: Thiếu yếu tố nào, AI tự đoán ở chỗ đó. Giống hệt nhân viên mới.
    loi:
      - "Để giao việc cho đủ, có năm yếu tố. Thứ nhất là vai trò. Ai cũng biết câu “bạn là chuyên gia marketing”, nhưng hay quên vế thứ hai: bạn làm cho ai."
      - Chuyên gia giỏi mấy mà không biết công ty nào, bán gì, khách là ai, thì cũng chỉ có kiến thức suông. Khách là chủ doanh nghiệp thì phải nói kiểu khác với khách là người đi làm.
      - Thứ hai là mục đích, đi cùng thứ ba là nhiệm vụ. Cùng là viết bài Facebook, nhưng bài để bán hàng sẽ khác bài chỉ để lấy tương tác.
      - Cùng là hợp đồng, nếu mục đích là kéo được một khách quan trọng về, thì điều khoản phải có lợi hơn cho khách. Không nói mục đích, AI chỉ làm theo mẫu chung chung.
      - "Thứ tư là cách làm: bước một làm gì, bước hai làm gì, có mẫu nào, điều gì không được làm. Thứ năm là yêu cầu đầu ra, tức là thế nào thì gọi là xong."
      - "Ví dụ bảo dọn nhà vệ sinh cho sạch. Sạch là thế nào? Phải ghi ra: sàn khô, thay giấy, không có mùi. Yêu cầu đầu ra nên viết như vậy, thành một danh sách để soát."
      - Không cần công thức viết câu lệnh nào cả. Anh chị cứ gõ hoặc nói hết ý ra, hơi lộn xộn cũng được, miễn là đủ năm thứ này. AI tự sắp xếp lại được.
      - "Cách này không chỉ dùng cho AI đâu, giao việc cho nhân viên cũng vậy. Nhân viên làm sai, mình xem lại mình trước: đã giao đủ năm thứ này chưa?"

  - kieu: vs
    tieuDe: Cùng một việc, **hai cách giao**
    trai:
      nhan: Trước
      noi: “Viết báo cáo doanh thu tháng này cho anh.”
      ghiChu: Về mảng nào? Ai đọc? Để làm gì? Dài bao nhiêu? AI tự đoán hết.
    phai:
      nhan: Sau
      noi: Trợ lý kế toán, viết cho chủ cửa hàng · để quyết định nhập hàng · tóm tắt theo nhóm hàng · so với tháng trước, chỉ dùng số trong bảng · bảng 3 cột + 3 nhận xét, dưới 150 chữ.
      ghiChu: Đủ 5 yếu tố. AI làm đúng ngay lần đầu.
    loi:
      - "Thử so hai cách giao. Bên trái: “Viết báo cáo doanh thu tháng này cho anh.” Mảng nào? Ai đọc? Để làm gì? Dài bao nhiêu? AI phải đoán hết."
      - "Bên phải thì đủ cả: ai làm cho ai, để làm gì, làm việc gì, làm thế nào, và thế nào là xong. Giao kiểu này thì AI làm đúng ngay từ lần đầu."

  - kieu: the
    tieuDe: 3 thói quen giúp AI làm **ngày càng đúng**
    cot: 3
    the:
      - ten: Góp ý phải làm theo được
        moTa: "“Chưa đủ hay” thì AI lại đoán tiếp. “Đổi tiêu đề thành câu hỏi, cắt còn 10 chữ” thì sửa được ngay."
      - ten: Chia nhỏ việc
        moTa: Việc càng to, càng nhiều chỗ để bịa. Lập kế hoạch ở một cuộc trò chuyện, giao từng phần ở cuộc khác.
      - ten: Làm nhiều lần, kiểm tra chéo
        moTa: Đừng tin bản đầu tiên. Mở cuộc trò chuyện khác soi lại theo đúng tiêu chí “thế nào là xong”.
    loi:
      - "Giao một lần chưa chắc đã đúng, nhất là với người mới. Nên có ba thói quen đi kèm. Thói quen thứ nhất: góp ý sao cho người ta làm theo được."
      - "Nói “xấu quá, làm lại đi” thì người làm chỉ biết đoán tiếp, rồi lại sai tiếp. Phải nói cụ thể: chữ to hơn, đổi màu, thêm ảnh. Không biết tả thì đưa một mẫu mình ưng."
      - "Thói quen thứ hai: chia nhỏ việc. Việc càng to thì AI càng phải đoán nhiều, mỗi bước sai một chút, cộng lại là hỏng. Lên kế hoạch ở một cuộc trò chuyện, rồi làm từng phần ở cuộc khác."
      - "Thói quen thứ ba: làm nhiều lần và kiểm tra chéo. Làm xong thì mở một cuộc trò chuyện mới, đưa đề bài, tiêu chí và bài làm vào, nhờ nó soát xem chỗ nào chưa đạt."
      - Cuộc trò chuyện mới không bị những gì mình nói trước đó dẫn dắt, nên dễ nhìn ra lỗ hổng hơn. Giống như trong xưởng lúc nào cũng có người kiểm tra chất lượng vậy.

  - kieu: bang
    tieuDe: "Bài tập trọng tâm: **12 mối quan hệ** · Ngày 0"
    cotTieuDe: [ Mã, Nhóm, Ghi chú ]
    dong:
      - [ KH01, Đang tìm hiểu, "**Đã hứa gửi báo giá hôm qua nhưng chưa gửi**" ]
      - [ KH04, Người quen, Nói rõ hiện chưa có nhu cầu; không đề nghị liên hệ lại ]
      - [ KH05, Khách quan tâm, "**Khách đề nghị đặt lịch demo trong 2 ngày**" ]
      - [ KH09, Khách quan tâm, "**Đề nghị gửi hồ sơ năng lực ngay hôm nay**" ]
      - [ KH10, Khách mới, Có nhu cầu nhưng chưa nêu ngân sách hay thời gian ]
      - [ KH12, Khách cũ, Yêu cầu không liên hệ lại trong tháng này ]
    chot: Dữ liệu giả lập, trích 6/12 dòng. Bảng đầy đủ có trên trang học.
    loi:
      - Giờ mình dùng ngay vào bài tập chính. Lớp có sẵn một bảng giả lập mười hai mối quan hệ. Hôm nay mình gọi là Ngày không.
      - Anh chị nhìn kỹ nhé. Khách số một đã được hứa gửi báo giá từ hôm qua mà chưa gửi. Khách số chín muốn nhận hồ sơ năng lực ngay trong hôm nay.
      - Khách số mười hai thì dặn tháng này đừng liên hệ lại. Khách số bốn nói rõ là chưa có nhu cầu. Những thứ này nằm rải rác, rất dễ quên.
      - Câu lệnh trên trang học đã viết sẵn đủ năm yếu tố, kèm dữ liệu mười hai mã. Anh chị chỉ cần sao chép, dán vào Claude rồi gửi.

  - kieu: ds
    tieuDe: Đọc kết quả, rồi **kiểm tra chéo**
    dau: tich
    ds:
      - ten: Đủ 12 mã, không thêm khách
      - ten: Mỗi lý do ưu tiên có bằng chứng từ ghi chú
      - ten: Không liên hệ KH12, không thúc ép KH04
      - ten: Không có “đã chốt đơn”, “dự kiến doanh thu” khi thiếu dữ liệu
      - ten: Tin nhắn nhắc đúng mốc đã hứa
    chot: "Gửi tiêu chí này vào một cuộc trò chuyện mới để soát (thói quen 3), rồi lưu SP01."
    loi:
      - Claude trả kết quả rồi thì đừng tin ngay. Đọc từng lý do ưu tiên, xem có đúng với ghi chú trong bảng không.
      - "Sau đó thử thói quen thứ nhất: chọn một tin nhắn, góp ý thật cụ thể. Ví dụ rút còn ba câu, đưa hai khung giờ demo để khách chọn."
      - "Rồi đến thói quen thứ ba: dán kết quả cùng các tiêu chí này vào một cuộc trò chuyện mới, nhờ nó soát lại."
      - Cuối cùng, chép bảng sang Google Sheets, chọn một việc làm được ngay hôm nay, và lưu SP01. Giờ anh chị làm bảy bước của chặng hai nhé.
