# Màn mở đầu: bản đồ buổi học (giáo trình v3.0, 20/10/2026).
# Mỗi màn có "kieu" (bia, xacSuat, chat, bang, bac, the, ds, vs, luong, hop, songSong) và "loi" là phụ đề
# giảng viên đọc theo. "loi" là danh sách: mỗi dòng một nhịp, bấm "Tiếp" sang nhịp sau rồi mới sang màn sau.
# **chữ** để nhấn màu.
man:
  - kieu: bia
    tieuDe: Từ ô chat đến **một đội AI** cùng làm việc
    phu: Hiểu bản chất · biết giao việc · giải phóng bản thân khỏi việc lặp lại
    loi:
      - Kính chào anh chị. Buổi hôm nay có câu hỏi gì anh chị cứ thoải mái dừng em lại, hỏi luôn.
      - Em mong sau buổi này anh chị có ba thay đổi. Thứ nhất là hiểu được thực sự AI vận hành như thế nào. Không phải lý thuyết máy học đâu ạ, em nói rất đơn giản thôi.
      - Đó là một nhân sự AI gồm những thành phần gì, và dùng bạn ấy như thế nào. Hiểu bản chất.
      - Thứ hai, hiểu bản chất rồi thì anh chị giao việc được cho bạn ấy. Anh chị là người ra đề bài, làm sao để cùng AI đạt được mục tiêu.
      - Và thứ ba, anh chị bắt đầu đóng gói công việc của mình lại, giao sang cho AI, và giải phóng được bản thân.

  - kieu: the
    tieuDe: Hôm nay đi **4 chặng**
    cot: 4
    the:
      - ten: Hiểu AI
        moTa: Nó “nghĩ” thế nào, vì sao hay bịa.
      - ten: Giao việc
        moTa: 5 yếu tố để AI làm đúng ý.
      - ten: Nhân sự AI
        moTa: Instruction, Memory, Knowledge, Skill, Tools.
      - ten: AI làm trên máy
        moTa: Cowork làm việc với tệp của anh chị, nhiều trợ lý chạy song song.
    chot: "Đích: có tư duy đúng khi dùng AI và biết tự động hóa việc lặp lại."
    loi:
      - "Hôm nay mình đi bốn chặng. Thứ nhất là hiểu AI: nó hoạt động thế nào, nó nghĩ ra làm sao."
      - "Thứ hai là giao việc: làm sao để anh chị giao việc cho thật hiệu quả."
      - Thứ ba là hiểu cấu trúc của một nhân sự AI. Nắm được cái này rồi thì anh chị dùng bạn ấy cho bất kỳ công việc gì luôn.
      - "Và cuối cùng là một kiến thức hơi nâng cao, nhưng em nghĩ giờ ai cũng nên biết. Đó là Cowork: AI làm việc ngay trên máy tính, trên chính các tệp của anh chị."
      - Qua bốn chặng này, em cố gắng giúp anh chị có tư duy đúng về AI, và tự động hóa được những việc lặp đi lặp lại.

  - kieu: the
    tieuDe: Thêm hai phần **thực hành**
    cot: 2
    danhSo: false
    the:
      - ten: Thương hiệu cá nhân
        moTa: Claude viết lời giới thiệu, ChatGPT chỉnh ảnh đại diện.
        nhan: SP03 · SP04
      - ten: Chốt lại
        moTa: Năm mảnh ghép và ba việc bắt đầu ngay tuần này.
        nhan: Nhận chứng chỉ
    loi:
      - Xong bốn chặng thì có thêm hai phần ngắn. Phần đầu là làm lời giới thiệu bản thân và ảnh đại diện. Phần ảnh mình dùng ChatGPT.
      - Phần cuối là chốt lại cả buổi, và mỗi người chọn ra mấy việc để bắt tay làm ngay trong tuần này.

  - kieu: ds
    tieuDe: Cuối buổi anh chị **mang về**
    ds:
      - ten: Kế hoạch chăm sóc 7 ngày
        moTa: Từ 12 mối quan hệ giả lập (SP01)
      - ten: Một trợ lý Claude biết việc của mình
        moTa: Project “Trợ lý kinh doanh của tôi” (SP02)
      - ten: Hồ sơ thương hiệu cá nhân
        moTa: Câu định vị, đoạn 70–100 chữ, lời giới thiệu 30 giây (SP03)
      - ten: Ảnh đại diện hoặc câu lệnh chỉnh ảnh
        moTa: Làm tiếp ở nhà nếu hết lượt (SP04)
    loi:
      - Em không muốn anh chị chỉ ngồi nghe. Cuối buổi, mỗi người cầm về bốn thứ dùng được ngay.
      - Đó là một kế hoạch chăm sóc khách bảy ngày, một trợ lý Claude đã biết việc của mình, một bộ lời giới thiệu bản thân, và một ảnh đại diện hoặc câu lệnh để làm tiếp ở nhà.
      - Cả bốn thứ đều lưu lại được trên trang học, ở mục Kết quả của tôi. Sau này cần thì mở ra xem lại.

  - kieu: luong
    tieuDe: Cách học hôm nay
    buoc:
      - ten: Xem
        moTa: Giảng viên chiếu màn, giải thích
      - ten: Làm
        moTa: Tự làm trên máy theo các bước của trang học
      - ten: Chốt
        moTa: Bấm “Hoàn thành chặng” rồi sang chặng sau
    noiBat: 2
    loi:
      - Mỗi chặng mình đi ba nhịp. Em chiếu và giải thích trước, rồi anh chị tự làm ngay trên máy theo các bước trên trang học.
      - Làm xong thì bấm Hoàn thành chặng, cả lớp chốt lại với nhau rồi mới sang chặng sau.
      - Cứ làm tay ngay trên lớp thì về nhà mới nhớ. Chỗ nào vướng thì anh chị giơ tay, trợ giảng sẽ xuống hỗ trợ.

  - kieu: hop
    tieuDe: Một quy tắc cho cả buổi
    noi: Chỉ dùng **dữ liệu giả lập** do lớp cung cấp. Không nhập tên thật, số điện thoại hay thông tin riêng của khách hàng.
    loi:
      - Có một quy tắc cho cả buổi. Hôm nay mình chỉ dùng dữ liệu giả lập mà lớp đã chuẩn bị sẵn.
      - Anh chị đừng đưa tên thật, số điện thoại hay thông tin riêng của khách vào AI khi chưa được phép. Rồi, mình đi vào luôn cho nhanh ạ.
