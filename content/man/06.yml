# Màn chốt lại.
man:
  - kieu: bac
    tieuDe: Đủ **5 mảnh ghép** = cấp 3 · Trưởng phòng
    bac:
      - nhan: "01"
        ten: Tư duy
        moTa: Giao việc, Instruction, Memory · chặng 1–3
      - nhan: "02"
        ten: Công cụ
        moTa: Connector nối ứng dụng · chặng 3
      - nhan: "03"
        ten: Công thức
        moTa: Skill · chặng 3
      - nhan: "04"
        ten: Môi trường
        moTa: Cowork trên máy của anh chị · chặng 4
      - nhan: "05"
        ten: Đội ngũ
        moTa: Trợ lý phụ chạy song song · chặng 4
    chot: Xây dần từ dưới lên. Mỗi Project là một nhân sự; bên trong có thể có trợ lý phụ.
    loi:
      - "Rồi, em tổng quan lại cả buổi hôm nay. Anh chị đã nắm được sơ sơ một nhân sự AI được tạo ra thế nào: năm mảnh ghép để có một bạn ở cấp ba."
      - "Mảnh đầu là tư duy: giao việc, instruction, memory. Rồi đến công cụ, tức là connector. Rồi công thức, là skill."
      - Tiếp theo là môi trường làm việc, là Cowork trên máy mình. Và cuối cùng là đội ngũ, là các trợ lý phụ chạy song song.
      - "Anh chị nào học nhanh thì từ đây tự học tiếp là làm chủ được cấp ba, vào vai trưởng phòng. AI không còn chỉ là công cụ chat nữa: mỗi Project là một nhân sự, bên trong lại có trợ lý phụ."

  - kieu: ds
    tieuDe: Bắt đầu **từ tuần này**
    ds:
      - ten: Tạo một Project “Trợ lý cá nhân”
        moTa: Nói tự do về việc của mình, để AI viết Instruction.
      - ten: Nối Google Calendar và Notion
        moTa: "Giao một việc thật: lên lịch, tạo việc cần làm."
      - ten: Chọn một việc lặp lại mỗi tuần
        moTa: Làm cùng AI tới khi ưng, rồi gói thành skill.
    loi:
      - Nếu hỏi về nhà nên làm gì, thì anh chị làm luôn đi ạ. Tạo một Project trợ lý cá nhân để quản lý lịch, quản lý việc cho mình. Bắt đầu bằng việc cho nó instruction.
      - Kết nối Google Calendar, kết nối Gmail để nó xử lý được những việc đó, rồi giao cho nó một việc thật.
      - Tiếp theo, mỗi tuần chọn một việc lặp lại. Cuối tuần ngồi soi xem mình còn làm gì thủ công, lặp đi lặp lại, đưa vào danh sách cần đóng gói skill. Cứ mỗi tuần lại nhẹ bớt việc đi một tí.

  - kieu: hop
    tieuDe: Điều nhớ nhất
    noi: Cái gì **máy làm tốt** thì người đừng làm. Định hướng, hiểu khách hàng và quyết định cuối cùng **vẫn là việc của mình**.
    phu: Không cần giỏi công nghệ mới bắt đầu. Vướng chỗ nào, hỏi chính AI cách dùng nó.
    loi:
      - "Em có một câu luôn muốn anh chị ghim vào đầu: cái gì máy làm tốt thì người đừng làm. Những việc lặp lại, có quy trình sẵn, người không làm tốt bằng máy đâu, nói thật."
      - Thế mình mạnh hơn máy ở đâu? Là biết mình muốn gì, là định hướng, là nắm được khách hàng thực sự cần gì, đằng sau đó họ đang lo gì. Những cái đó AI không có.
      - Mà dùng AI thì dễ lắm, chẳng công cụ nào dễ bằng. Học phần mềm còn phải biết nút nào ở đâu, còn AI chỉ cần chịu mở miệng ra nói.
      - Vướng ở đâu, chụp màn hình gửi cho nó, hỏi làm thế nào tiếp.
      - Giờ anh chị bấm hoàn thành đủ các chặng để nhận chứng chỉ. Em cảm ơn anh chị đã học cùng Gifty Tech.
