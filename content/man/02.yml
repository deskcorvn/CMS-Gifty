# Màn chặng 2 · Giao việc.
man:
  - kieu: bia
    so: "02"
    tieuDe: Giao việc — **5 yếu tố** để AI làm đúng ý
    phu: Chặng 2 · 45 phút · làm ra SP01
    loi:
      - "Chặng hai: giao việc. Em mở đầu bằng một kiến thức rất hay mà em nhớ mãi."

  - kieu: the
    tieuDe: Muốn ai làm việc cho mình, cần đủ **2 yếu tố**
    cot: 2
    danhSo: false
    the:
      - ten: Muốn làm (Will)
        moTa: Có động lực làm việc. AI thì lúc nào cũng sẵn sàng, sửa đến lần thứ mười cũng không phàn nàn.
        nhan: AI đã có sẵn
      - ten: Làm được (Able)
        moTa: Bối cảnh, công cụ, cách làm.
        nhan: Việc của anh chị
    noiBat: 2
    chot: AI luôn sẵn sàng làm. Việc của anh chị là giúp nó **làm được**.
    loi:
      - "Muốn bất kỳ ai làm việc gì cho mình thì chỉ có hai yếu tố thôi ạ. Thứ nhất là will: họ phải muốn làm. Thứ hai là able: họ phải làm được."
      - "Ví dụ nhờ đứa cháu chạy ra đầu ngõ mua cái gì đấy. Việc thì ai chẳng làm được. Nhưng nó sẽ nghĩ: sao cháu phải đi? Vì nó làm gì có động lực."
      - Nhưng bảo “chạy ra đi, chú cho tiền”, thế là nó đi ngay đúng không ạ?
      - "Nhân viên cũng thế, mỗi người một động lực: phát triển bản thân, thêm thu nhập, vì mối quan hệ. Mình toàn phải lo chuyện muốn làm."
      - Cái hay của AI là nó không cần yếu tố này. Lúc nào nó cũng sẵn sàng, hai bốn trên bảy. Anh chị thử bảo một bạn thiết kế sửa đến lần thứ ba xem mặt bạn ấy có khó chịu không?
      - Còn AI thì giao mười lần nó vẫn làm, nửa đêm gọi dậy nó vẫn làm, không đòi tăng lương, không đòi nghỉ phép. Nên với AI, anh chị bỏ được nguyên phần muốn làm này.
      - Chỉ cần tập trung vào làm được, tức là cho bạn ấy bối cảnh, công cụ, cách làm.
      - "Như nhân viên mới vào, được bảo viết báo cáo kinh doanh, thì sẽ hỏi: có mẫu không anh? Em chưa có máy tính?"

  - kieu: the
    tieuDe: Giao việc đủ **5 yếu tố**
    cot: 5
    the:
      - ten: Vai trò
        moTa: AI vào vai ai, làm cho ai đọc.
      - ten: Mục đích
        moTa: Việc này để đạt điều gì.
      - ten: Nhiệm vụ
        moTa: Chính xác làm gì, tới đâu.
      - ten: Cách làm
        moTa: Các bước, mẫu, ràng buộc.
      - ten: Yêu cầu đầu ra
        moTa: Thế nào thì gọi là xong.
    chot: Thiếu yếu tố nào, AI tự đoán ở chỗ đó. Giống hệt nhân viên mới.
    loi:
      - "Thế thì việc đầu tiên là giao tiếp: nói sao cho bạn ấy hiểu anh chị muốn gì. Để giao việc cho đầy đủ thì có năm yếu tố."
      - "Thứ nhất là vai trò. Học viết câu lệnh thì ai cũng học rồi: bạn là chuyên gia marketing, bạn là chuyên gia nội dung. Nhưng còn một vế mọi người hay thiếu: bạn làm cho ai."
      - Chuyên gia marketing, nhưng cho công ty nào? Sản phẩm gì? Khách là ai?
      - Không có những thông tin đó thì chuyên gia cũng chỉ là người có kiến thức. Khách là chủ doanh nghiệp thì phải nói kiểu khác khách đi làm.
      - Tiếp theo là mục đích, đi cùng với nhiệm vụ. Nhiệm vụ là làm báo cáo, viết bài, làm báo giá. Nhưng mục đích là gì? Cùng một bài Facebook, bài để ra đơn sẽ khác bài chỉ để lấy tương tác.
      - Hay một hợp đồng. Nếu đây là khách quan trọng, hợp đồng đầu chỉ để kéo khách về, còn mình muốn có cả những hợp đồng sau, thì điều khoản phải có lợi hơn cho khách.
      - Không nói mục đích, AI làm theo mẫu chung.
      - "Hai yếu tố tiếp theo là thứ làm nên khác biệt của người có nhiều năm kinh nghiệm: cách làm và yêu cầu đầu ra. Cách làm là bước một làm gì, bước hai làm gì, phải hỏi ai, xin chữ ký ai."
      - "Còn yêu cầu đầu ra, em hay gọi là định nghĩa hoàn thành. Ví dụ bảo dọn nhà vệ sinh cho sạch. Thế nào là sạch? Phải gạch đầu dòng ra: sàn khô, thay giấy, không có mùi lạ."
      - Vai trò, mục đích, nhiệm vụ, cách làm, yêu cầu đầu ra. Chỉ cần nhớ năm cái này thôi, không cần nhớ thêm công thức viết câu lệnh nào cả.
      - Vì AI không cần mình đưa thông tin theo thứ tự đẹp đẽ.
      - Mẹo thực tế là gì ạ? Mở một tệp Word ra, ngồi gõ hết những gì mình nghĩ ra, hoặc nói bằng giọng cho nhanh.
      - Lộn xộn cũng được, miễn đủ chi tiết, rồi ném nguyên vào cho AI. Nó tự sắp xếp lại được.
      - "Và cái này không chỉ cho AI mà cho cả người. Nhân viên làm sai, anh chị nhìn lại mình trước: mình giao đã đủ năm cái này chưa."
      - Mà sếp nào giao việc được như thế này thì nhân viên sướng biết bao.

  - kieu: vs
    tieuDe: Cùng một việc, **hai cách giao**
    trai:
      nhan: Trước
      noi: “Viết báo cáo doanh thu tháng này cho anh.”
      ghiChu: Về mảng nào? Ai đọc? Để làm gì? Dài bao nhiêu? AI tự đoán hết.
    phai:
      nhan: Sau
      noi: Trợ lý kế toán, viết cho chủ cửa hàng · để quyết định nhập hàng · tóm tắt theo nhóm hàng · so với tháng trước, chỉ dùng số trong bảng · bảng 3 cột + 3 nhận xét, dưới 150 chữ.
      ghiChu: Đủ 5 yếu tố. AI làm đúng ngay lần đầu.
    loi:
      - Thử so hai cách giao. “Viết báo cáo doanh thu tháng này cho anh.” Về mảng nào? Ai đọc? Để làm gì? Dài bao nhiêu? AI tự đoán hết.
      - "Còn bên phải thì đủ năm yếu tố: ai làm cho ai, để làm gì, làm việc gì, làm thế nào, thế nào là xong. Giao như vậy thì AI làm đúng ngay từ lần đầu."

  - kieu: the
    tieuDe: 3 thói quen giúp AI làm **ngày càng đúng**
    cot: 3
    the:
      - ten: Góp ý phải làm theo được
        moTa: "“Chưa đủ hay” thì AI lại đoán tiếp. “Đổi tiêu đề thành câu hỏi, cắt còn 10 chữ” thì sửa được ngay."
      - ten: Chia nhỏ việc
        moTa: Việc càng to, càng nhiều chỗ để bịa. Lập kế hoạch ở một cuộc trò chuyện, giao từng phần ở cuộc khác.
      - ten: Làm nhiều lần, kiểm tra chéo
        moTa: Đừng tin bản đầu tiên. Mở cuộc trò chuyện khác soi lại theo đúng tiêu chí “thế nào là xong”.
    loi:
      - "Nhưng anh chị hiểu thế này: giao cho người cũng không thể kỳ vọng giao một phát là làm được luôn, nhất là một bạn thực tập sinh. Nên có ba thói quen để làm với AI hiệu quả hơn nữa."
      - "Thói quen một là phản hồi. Vẫn chuyện bạn thiết kế: tại sao đến lần thứ ba mặt bạn ấy khó chịu?"
      - Vì mình cứ bảo “xấu quá, làm lại đi”. Bạn ấy không biết làm lại thế nào, lại tự đoán, lại sai.
      - "Phản hồi phải làm theo được, nghe xong là biết làm gì tiếp: chữ to ra, đổi màu, thêm ảnh. Không nói ra được thì tìm vài mẫu mình ưng, đưa cho họ và nói ưng ở chỗ nào."
      - Thói quen hai là chia nhỏ việc. Đừng giao một việc siêu to khổng lồ, vì bước nào nó cũng phải tự đoán, mỗi chỗ sai một tí, cộng lại thì sai rất to.
      - Việc to quá thì ra sản phẩm rất trung bình.
      - Mẹo là ngồi lên kế hoạch với một cuộc trò chuyện trước. Kế hoạch gồm ba phần thì mỗi phần mở một cuộc trò chuyện khác ra làm, làm từng bước một. Chất lượng sẽ cao hơn rất nhiều.
      - "Thói quen ba là đặc quyền khi dùng AI: làm nhiều lần và kiểm tra chéo. Với người, sửa đến lần thứ bảy thì ai cũng mệt. Với AI thì không giới hạn số lần."
      - Kiểm tra chéo là sao? Như trong sản xuất luôn có người kiểm tra chất lượng.
      - Làm xong, mở một cuộc trò chuyện khác, trình bày lại vấn đề, mục tiêu, đưa bài làm vào, bảo nó phản biện. Nó chỉ ra lỗ hổng ngay.
